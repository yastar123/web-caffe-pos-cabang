                $ref: "#/components/schemas/ImageUploadResult"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # AUTH
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        branchId:
          type: ["integer", "null"]

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    # USER
    User:
      type: object
      required: [id, name, email, role, branchId, isActive, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, manager, cashier, waiter, chef, warehouse]
        branchId:
          type: ["integer", "null"]
        isActive:
          type: boolean
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    UserInput:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [owner, manager, cashier, waiter, chef, warehouse]
        branchId:
          type: ["integer", "null"]
        avatarUrl:
          type: ["string", "null"]

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, manager, cashier, waiter, chef, warehouse]
        branchId:
          type: ["integer", "null"]
        isActive:
          type: boolean
        avatarUrl:
          type: ["string", "null"]

    # BRANCH
    Branch:
      type: object
      required: [id, name, address, phone, isActive, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        taxRate:
          type: number
        isActive:
          type: boolean
        createdAt:
          type: string

    BranchInput:
      type: object
      required: [name, address, phone]
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        taxRate:
          type: number

    BranchUpdate:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        taxRate:
          type: number
        isActive:
          type: boolean

    # MENU CATEGORY
    MenuCategory:
      type: object
      required: [id, name, branchId, sortOrder, isActive, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        branchId:
          type: integer
        iconUrl:
          type: ["string", "null"]
        sortOrder:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string

    MenuCategoryInput:
      type: object
      required: [name, branchId]
      properties:
        name:
          type: string
        branchId:
          type: integer
        iconUrl:
          type: ["string", "null"]
        sortOrder:
          type: integer

    MenuCategoryUpdate:
      type: object
      properties:
        name:
          type: string
        iconUrl:
          type: ["string", "null"]
        sortOrder:
          type: integer
        isActive:
          type: boolean

    # MENU ITEM
    MenuItem:
      type: object
      required: [id, name, price, categoryId, branchId, isAvailable, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        imageUrl:
          type: ["string", "null"]
        categoryId:
          type: integer
        categoryName:
          type: ["string", "null"]
        branchId:
          type: integer
        station:
          type: ["string", "null"]
        preparationTime:
          type: ["integer", "null"]
        isAvailable:
          type: boolean
        createdAt:
          type: string

    MenuItemInput:
      type: object
      required: [name, price, categoryId, branchId]
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        imageUrl:
          type: ["string", "null"]
        categoryId:
          type: integer
        branchId:
          type: integer
        station:
          type: ["string", "null"]
        preparationTime:
          type: ["integer", "null"]

    MenuItemUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        imageUrl:
          type: ["string", "null"]
        categoryId:
          type: integer
        station:
          type: ["string", "null"]
        preparationTime:
          type: ["integer", "null"]
        isAvailable:
          type: boolean

    # TABLE
    Table:
      type: object
      required: [id, number, area, capacity, status, branchId, createdAt]
      properties:
        id:
          type: integer
        number:
          type: string
        area:
          type: string
          enum: [indoor, outdoor, vip]
        capacity:
          type: integer
        status:
          type: string
          enum: [available, occupied, reserved, cleaning]
        branchId:
          type: integer
        xPos:
          type: ["number", "null"]
        yPos:
          type: ["number", "null"]
        currentOrderId:
          type: ["integer", "null"]
        occupiedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    TableInput:
      type: object
      required: [number, area, capacity, branchId]
      properties:
        number:
          type: string
        area:
          type: string
          enum: [indoor, outdoor, vip]
        capacity:
          type: integer
        branchId:
          type: integer
        xPos:
          type: ["number", "null"]
        yPos:
          type: ["number", "null"]

    TableUpdate:
      type: object
      properties:
        number:
          type: string
        area:
          type: string
          enum: [indoor, outdoor, vip]
        capacity:
          type: integer
        xPos:
          type: ["number", "null"]
        yPos:
          type: ["number", "null"]

    TableStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [available, occupied, reserved, cleaning]

    # RESERVATION
    Reservation:
      type: object
      required: [id, customerName, customerPhone, date, time, guestCount, status, branchId, createdAt]
      properties:
        id:
          type: integer
        customerName:
          type: string
        customerPhone:
          type: string
        customerEmail:
          type: ["string", "null"]
        date:
          type: string
        time:
          type: string
        guestCount:
          type: integer
        tableId:
          type: ["integer", "null"]
        tableNumber:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, confirmed, seated, completed, cancelled, waitlist]
        notes:
          type: ["string", "null"]
        depositAmount:
          type: ["number", "null"]
        branchId:
          type: integer
        createdAt:
          type: string

    ReservationInput:
      type: object
      required: [customerName, customerPhone, date, time, guestCount, branchId]
      properties:
        customerName:
          type: string
        customerPhone:
          type: string
        customerEmail:
          type: ["string", "null"]
        date:
          type: string
        time:
          type: string
        guestCount:
          type: integer
        tableId:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        depositAmount:
          type: ["number", "null"]
        branchId:
          type: integer

    ReservationUpdate:
      type: object
      properties:
        customerName:
          type: string
        customerPhone:
          type: string
        customerEmail:
          type: ["string", "null"]
        date:
          type: string
        time:
          type: string
        guestCount:
          type: integer
        tableId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [pending, confirmed, seated, completed, cancelled, waitlist]
        notes:
          type: ["string", "null"]
        depositAmount:
          type: ["number", "null"]

    # ORDER
    Order:
      type: object
      required: [id, orderNumber, tableId, tableNumber, status, branchId, items, subtotal, tax, total, createdAt]
      properties:
        id:
          type: integer
        orderNumber:
          type: string
        tableId:
          type: integer
        tableNumber:
          type: string
        customerId:
          type: ["integer", "null"]
        customerName:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, served, completed, voided]
        branchId:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        subtotal:
          type: number
        discountAmount:
          type: number
        tax:
          type: number
        total:
          type: number
        notes:
          type: ["string", "null"]
        staffId:
          type: ["integer", "null"]
        staffName:
          type: ["string", "null"]
        createdAt:
          type: string
        completedAt:
          type: ["string", "null"]

    OrderInput:
      type: object
      required: [tableId, branchId, items]
      properties:
        tableId:
          type: integer
        branchId:
          type: integer
        customerId:
          type: ["integer", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"
        notes:
          type: ["string", "null"]
        discountAmount:
          type: number

    OrderUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, served, completed, voided]
        notes:
          type: ["string", "null"]
        discountAmount:
          type: number

    OrderItem:
      type: object
      required: [id, orderId, menuItemId, menuItemName, quantity, unitPrice, totalPrice, kitchenStatus, createdAt]
      properties:
        id:
          type: integer
        orderId:
          type: integer
        menuItemId:
          type: integer
        menuItemName:
          type: string
        menuItemImage:
          type: ["string", "null"]
        quantity:
          type: integer
        unitPrice:
          type: number
        totalPrice:
          type: number
        notes:
          type: ["string", "null"]
        kitchenStatus:
          type: string
          enum: [new, processing, ready, served]
        station:
          type: ["string", "null"]
        createdAt:
          type: string

    OrderItemInput:
      type: object
      required: [menuItemId, quantity]
      properties:
        menuItemId:
          type: integer
        quantity:
          type: integer
        notes:
          type: ["string", "null"]

    OrderItemUpdate:
      type: object
      properties:
        quantity:
          type: integer
        notes:
          type: ["string", "null"]

    VoidInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
        authorizerId:
          type: ["integer", "null"]

    # KITCHEN
    KitchenOrder:
      type: object
      required: [orderId, orderNumber, tableNumber, items, createdAt]
      properties:
        orderId:
          type: integer
        orderNumber:
          type: string
        tableNumber:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string
        priority:
          type: integer

    KitchenItemStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [new, processing, ready, served]

    # PAYMENT
    Payment:
      type: object
      required: [id, orderId, amount, method, status, branchId, createdAt]
      properties:
        id:
          type: integer
        orderId:
          type: integer
        orderNumber:
          type: ["string", "null"]
        amount:
          type: number
        method:
          type: string
          enum: [cash, card, qris, ewallet, transfer]
        status:
          type: string
          enum: [pending, completed, refunded, failed]
        change:
          type: ["number", "null"]
        referenceNumber:
          type: ["string", "null"]
        branchId:
          type: integer
        staffId:
          type: ["integer", "null"]
        staffName:
          type: ["string", "null"]
        createdAt:
          type: string

    PaymentInput:
      type: object
      required: [orderId, amount, method, branchId]
      properties:
        orderId:
          type: integer
        amount:
          type: number
        method:
          type: string
          enum: [cash, card, qris, ewallet, transfer]
        cashReceived:
          type: ["number", "null"]
        referenceNumber:
          type: ["string", "null"]
        branchId:
          type: integer

    RefundInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
        amount:
          type: ["number", "null"]

    # INGREDIENT / STOCK
    Ingredient:
      type: object
      required: [id, name, unit, currentStock, minStock, branchId, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        unit:
          type: string
        currentStock:
          type: number
        minStock:
          type: number
        costPerUnit:
          type: ["number", "null"]
        branchId:
          type: integer
        supplierId:
          type: ["integer", "null"]
        supplierName:
          type: ["string", "null"]
        isLow:
          type: boolean
        createdAt:
          type: string

    IngredientInput:
      type: object
      required: [name, unit, currentStock, minStock, branchId]
      properties:
        name:
          type: string
        unit:
          type: string
        currentStock:
          type: number
        minStock:
          type: number
        costPerUnit:
          type: ["number", "null"]
        branchId:
          type: integer
        supplierId:
          type: ["integer", "null"]

    IngredientUpdate:
      type: object
      properties:
        name:
          type: string
        unit:
          type: string
        currentStock:
          type: number
        minStock:
          type: number
        costPerUnit:
          type: ["number", "null"]
        supplierId:
          type: ["integer", "null"]

    StockMovement:
      type: object
      required: [id, ingredientId, ingredientName, type, quantity, branchId, createdAt]
      properties:
        id:
          type: integer
        ingredientId:
          type: integer
        ingredientName:
          type: string
        type:
          type: string
          enum: [in, out, adjustment, waste, transfer]
        quantity:
          type: number
        notes:
          type: ["string", "null"]
        branchId:
          type: integer
        staffId:
          type: ["integer", "null"]
        createdAt:
          type: string

    StockMovementInput:
      type: object
      required: [ingredientId, type, quantity, branchId]
      properties:
        ingredientId:
          type: integer
        type:
          type: string
          enum: [in, out, adjustment, waste, transfer]
        quantity:
          type: number
        notes:
          type: ["string", "null"]
        branchId:
          type: integer

    PurchaseOrder:
      type: object
      required: [id, supplierName, status, branchId, items, totalAmount, createdAt]
      properties:
        id:
          type: integer
        supplierName:
          type: string
        supplierContact:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, sent, received, cancelled]
        branchId:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderItem"
        totalAmount:
          type: number
        notes:
          type: ["string", "null"]
        expectedDelivery:
          type: ["string", "null"]
        createdAt:
          type: string

    PurchaseOrderItem:
      type: object
      required: [ingredientId, ingredientName, quantity, unit, unitCost, totalCost]
      properties:
        ingredientId:
          type: integer
        ingredientName:
          type: string
        quantity:
          type: number
        unit:
          type: string
        unitCost:
          type: number
        totalCost:
          type: number

    PurchaseOrderInput:
      type: object
      required: [supplierName, branchId, items]
      properties:
        supplierName:
          type: string
        supplierContact:
          type: ["string", "null"]
        branchId:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderItem"
        notes:
          type: ["string", "null"]
        expectedDelivery:
          type: ["string", "null"]

    PurchaseOrderUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [draft, sent, received, cancelled]
        notes:
          type: ["string", "null"]

    # CUSTOMER
    Customer:
      type: object
      required: [id, name, phone, loyaltyPoints, totalSpend, visitCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        loyaltyPoints:
          type: integer
        totalSpend:
          type: number
        visitCount:
          type: integer
        membershipTier:
          type: ["string", "null"]
        birthdate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    CustomerInput:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        birthdate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    CustomerUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        birthdate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        loyaltyPoints:
          type: integer

    # REPORTS
    SalesSummary:
      type: object
      required: [totalRevenue, totalOrders, averageOrderValue, periods]
      properties:
        totalRevenue:
          type: number
        totalOrders:
          type: integer
        averageOrderValue:
          type: number
        periods:
          type: array
          items:
            $ref: "#/components/schemas/SalesPeriod"

    SalesPeriod:
      type: object
      required: [date, revenue, orders]
      properties:
        date:
          type: string
        revenue:
          type: number
        orders:
          type: integer

    TopMenuItem:
      type: object
      required: [menuItemId, menuItemName, quantitySold, totalRevenue]
      properties:
        menuItemId:
          type: integer
        menuItemName:
          type: string
        imageUrl:
          type: ["string", "null"]
        quantitySold:
          type: integer
        totalRevenue:
          type: number

    BranchStat:
      type: object
      required: [branchId, branchName, revenue, orders, averageOrderValue]
      properties:
        branchId:
          type: integer
        branchName:
          type: string
        revenue:
          type: number
        orders:
          type: integer
        averageOrderValue:
          type: number

    PaymentMethodStat:
      type: object
      required: [method, count, amount, percentage]
      properties:
        method:
          type: string
        count:
          type: integer
        amount:
          type: number
        percentage:
          type: number

    # DASHBOARD
    DashboardOverview:
      type: object
      required: [todayRevenue, todayOrders, activeOrders, activeTables, totalTables, pendingReservations, lowStockCount]
      properties:
        todayRevenue:
          type: number
        todayOrders:
          type: integer
        activeOrders:
          type: integer
        activeTables:
          type: integer
        totalTables:
          type: integer
        pendingReservations:
          type: integer
        lowStockCount:
          type: integer
        revenueChange:
          type: number
        ordersChange:
          type: number

    PeakHourStat:
      type: object
      required: [hour, orders, revenue]
      properties:
