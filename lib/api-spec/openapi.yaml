          type: integer
        orders:
          type: integer
        revenue:
          type: number

    LowStockAlert:
      type: object
      required: [ingredientId, ingredientName, currentStock, minStock, unit]
      properties:
        ingredientId:
          type: integer
        ingredientName:
          type: string
        currentStock:
          type: number
        minStock:
          type: number
        unit:
          type: string

    # UPLOAD
    ImageUploadInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: Base64 encoded image data or remote URL
        folder:
          type: string

    ImageUploadResult:
      type: object
      required: [url, publicId]
      properties:
        url:
          type: string
        publicId:
          type: string
        width:
          type: ["integer", "null"]
        height:
          type: ["integer", "null"]
